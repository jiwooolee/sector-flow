// ── 장 단계 라벨 ─────────────────────────────────────────────────────────────
const PHASE_META={
  PRE:     {label:'프리장',  color:'#F59E0B', bg:'#F59E0B18', border:'#F59E0B35'},
  REGULAR: {label:'본장',    color:'#10D97E', bg:'#10D97E18', border:'#10D97E35'},
  POST:    {label:'시간외',  color:'#818CF8', bg:'#818CF818', border:'#818CF835'},
  CLOSED:  {label:'장마감',  color:'#4A5A70', bg:'#4A5A7018', border:'#4A5A7035'},
};
function phaseMeta(p){return PHASE_META[p]||PHASE_META.CLOSED;}

// ── 시장 시간 ────────────────────────────────────────────────────────────────
function mkt(){
  const now=new Date();
  function local(tz){
    try{
      const s=now.toLocaleString('en-US',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit',weekday:'short'});
      const[wd,time]=s.split(', ');const[h,m]=time.split(':').map(Number);
      return{h,m,d:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[wd]??1,str:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`};
    }catch{return{h:9,m:0,d:1,str:'--:--'};}
  }
  const kr=local('Asia/Seoul'),us=local('America/New_York'),kt=kr.h*60+kr.m,ut=us.h*60+us.m;
  const krOpen=kr.d>=1&&kr.d<=5&&kt>=540&&kt<930;
  const usOpen=us.d>=1&&us.d<=5&&ut>=570&&ut<960;
  const usPre =us.d>=1&&us.d<=5&&ut>=240&&ut<570;
  const usPost=us.d>=1&&us.d<=5&&ut>=960&&ut<1200;
  const usPhase=usOpen?'REGULAR':usPre?'PRE':usPost?'POST':'CLOSED';
  return{
    kr:{open:krOpen,time:kr.str+' KST'},
    us:{phase:usPhase,time:us.str+' ET'},
    usPhase,
  };
}

// ── Yahoo Finance 데이터 ──────────────────────────────────────────────────────
async function fetchQuotes(symbols){
  const url=`https://query1.finance.yahoo.com/v7/finance/quote?lang=en-US&region=US&symbols=${symbols.join(',')}`;
  const proxies=[
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p,{signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      const j=await r.json();
      const result=j.quoteResponse?.result||[];
      if(result.length>0)return result;
    }catch(e){}
  }
  throw new Error('시세 데이터를 가져올 수 없습니다');
}

// ── 핵심: 장 단계에 따라 올바른 등락률 선택 ─────────────────────────────────
function pickQuoteData(q){
  const state=q.marketState||'CLOSED';

  // 프리장: 전일 종가 대비 프리장 등락률
  if(state==='PRE' && q.preMarketChangePercent!=null && q.preMarketPrice!=null){
    return{
      chg:   q.preMarketChangePercent,
      price: q.preMarketPrice,
      phase: 'PRE',
      // 본장 등락률도 함께 보존 (전일 종가 기준)
      regChg: q.regularMarketChangePercent||0,
    };
  }

  // 시간외: 본장 등락률 표시 + 시간외 추가 변동 표시
  if((state==='POST'||state==='POSTPOST') && q.postMarketChangePercent!=null){
    return{
      chg:      q.regularMarketChangePercent||0,
      price:    q.regularMarketPrice||0,
      phase:    'POST',
      postChg:  q.postMarketChangePercent,
      postPrice:q.postMarketPrice,
    };
  }

  // 본장 / 장마감
  return{
    chg:   q.regularMarketChangePercent||0,
    price: q.regularMarketPrice||0,
    phase: state==='REGULAR'?'REGULAR':'CLOSED',
  };
}

function processQuotes(results){
  const quotes={};
  const phaseCounts={PRE:0,REGULAR:0,POST:0,CLOSED:0};
  results.forEach(q=>{
    const d=pickQuoteData(q);
    phaseCounts[d.phase]=(phaseCounts[d.phase]||0)+1;
    quotes[q.symbol]={...d, name:q.shortName||q.longName||q.symbol};
  });
  // 전체 장 단계 판단 (ETF 기준)
  const dominant=Object.entries(phaseCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'CLOSED';
  return{quotes, dominant};
}

// ── 섹터 데이터 구성 ─────────────────────────────────────────────────────────
function genReason(chg,phase){
  const pre=phase==='PRE'?'[프리장] ':'';
  if(chg>=3)  return pre+'기관·외인 대규모 순매수 · 강한 상승 모멘텀';
  if(chg>=2)  return pre+'외국인 주도 매수세 · 상승 우위';
  if(chg>=1)  return pre+'기관 순매수 지속 · 강세 흐름';
  if(chg>=0.3)return pre+'소폭 매수 우위 · 방어적 강세';
  if(chg>=-0.3)return pre+'관망세 · 보합 흐름';
  if(chg>=-1) return pre+'차익 실현 · 소폭 조정';
  if(chg>=-2) return pre+'기관 매도 우위 · 하방 압력';
  if(chg>=-3) return pre+'외인·기관 동반 매도세';
  return pre+'강한 매도 압력 · 패닉셀 우려';
}
function calcStrength(chg){
  const a=Math.abs(chg);
  if(a>=4)return 5;if(a>=2.5)return 4;if(a>=1.5)return 3;if(a>=0.7)return 2;return 1;
}
function fmtChg(v){const n=parseFloat(v)||0;return(n>=0?'+':'')+n.toFixed(2)+'%';}
function chgColor(v){return parseFloat(v)>=0?'#10D97E':'#FF4D4F';}

function buildSectors(quotes,dominant){
  const prev=S.data;
  return SECTORS.map(cfg=>{
    const etqData=quotes[cfg.etf];
    const etfChg=etqData?.chg||0;
    const etfPhase=etqData?.phase||'CLOSED';
    const flow=etfChg>=0?'inflow':'outflow';
    const strength=calcStrength(etfChg);

    const stocks=cfg.stocks.map(s=>{
      const q=quotes[s.t];
      return{
        ticker:s.d||s.t.replace('.KS','').replace('.KQ',''),
        name:s.n,market:s.m,
        chg:q?.chg||0,
        price:q?.price||0,
        phase:q?.phase||'CLOSED',
        postChg:q?.postChg,
      };
    }).filter(st=>st.price>0);

    // 방향에 맞게 정렬
    stocks.sort((a,b)=>flow==='inflow'?b.chg-a.chg:a.chg-b.chg);

    // 방향 전환 알림
    const prevSec=prev?.find(p=>p.name===cfg.name);
    if(prevSec&&prevSec.flow!==flow&&strength>=3){
      const pm=etfPhase==='PRE'?'[프리장] ':'';
      pushAlert(`${flow==='inflow'?'📈':'📉'} ${pm}${cfg.name} 방향 전환`,
                `${flow==='inflow'?'매수':'매도'}세 전환 · ${fmtChg(etfChg)}`);
    }

    return{name:cfg.name,icon:cfg.icon,etf:cfg.etf,
           flow,strength,chg:etfChg,chgStr:fmtChg(etfChg),
           reason:genReason(etfChg,etfPhase),
           etfPhase,stocks,etfInfo:cfg.etfInfo};
  });
}

function calcSentiment(sectors){
  const iS=sectors.filter(s=>s.flow==='inflow').reduce((a,s)=>a+s.strength,0);
  const oS=sectors.filter(s=>s.flow==='outflow').reduce((a,s)=>a+s.strength,0);
  const r=iS/(iS+oS||1);
  return r>0.6?'bullish':r<0.4?'bearish':'neutral';
}
function calcSummary(sectors,phase){
  const top=sectors.filter(s=>s.flow==='inflow').sort((a,b)=>b.strength-a.strength)[0];
  const bot=sectors.filter(s=>s.flow==='outflow').sort((a,b)=>b.strength-a.strength)[0];
  const tag=phase==='PRE'?'[프리장] ':phase==='POST'?'[시간외] ':'';
  if(top&&bot)return`${tag}${top.icon}${top.name} 강세 · ${bot.icon}${bot.name} 약세`;
  if(top)return`${tag}전 섹터 강세 · ${top.icon}${top.name} 선도`;
  return`${tag}전 섹터 약세`;
}

// ── 데이터 요청 ──────────────────────────────────────────────────────────────
async function doFetch(){
  if(S.loading)return;
  S.loading=true;
  updateDot(true);
  try{
    const etfSyms=SECTORS.map(s=>s.etf);
    const stkSyms=[...new Set(SECTORS.flatMap(s=>s.stocks.map(st=>st.t)))];
    const results=await fetchQuotes([...etfSyms,...stkSyms]);
    const{quotes,dominant}=processQuotes(results);
    const sectors=buildSectors(quotes,dominant);
    S.data=sectors;
    S.sentiment=calcSentiment(sectors);
    S.summary=calcSummary(sectors,dominant);
    S.marketPhase=dominant;
    S.lastUpdate=new Date();
    S.error=null;
  }catch(e){S.error=e.message;}
  S.loading=false;
  updateDot(false);
  render();
}

function updateDot(on){
  const d=$('adot');if(d)d.style.animation=on?'spin .8s linear infinite':'none';
  const i=$('aind');if(i)i.style.display=on?'flex':'none';
}

// ── 타이머 ──────────────────────────────────────────────────────────────────
function startTimers(){
  clearInterval(_rt);clearInterval(_ct);
  _next=Date.now()+S.cfg.interval*60000;
  _rt=setInterval(()=>{doFetch();_next=Date.now()+S.cfg.interval*60000;},S.cfg.interval*60000);
  _ct=setInterval(()=>{
    const rem=Math.max(0,(_next||Date.now())-Date.now()),mm=Math.floor(rem/60000),ss=Math.floor((rem%60000)/1000);
    const el=$('cd');if(el)el.textContent=`${mm}:${String(ss).padStart(2,'0')}`;
  },1000);
}
function startTick(){
  clearInterval(_tick);
  _tick=setInterval(()=>{
    document.querySelectorAll('.stchg').forEach(el=>{
      const base=parseFloat(el.dataset.base)||0;
      const v=+(base+(Math.random()-.5)*0.10).toFixed(2);
      const c=v>=0?'#10D97E':'#FF4D4F';
      el.textContent=(v>=0?'+':'')+v.toFixed(2)+'%';el.style.color=c;
      const row=el.closest('.strow');if(row){row.classList.remove('fg','fr');void row.offsetWidth;row.classList.add(v>=0?'fg':'fr');}
    });
  },2800);
}

// ── 장 단계 배너 ─────────────────────────────────────────────────────────────
function rPhaseBanner(){
  if(!S.data)return'';
  const pm2=phaseMeta(S.marketPhase);
  const msgs={
    PRE: '프리장 데이터 · 전일 종가 대비 등락률 · 본장 개시 후 변동될 수 있음',
    REGULAR: '본장 실시간 · 전일 종가 대비 등락률',
    POST: '시간외 거래 중 · 본장 종가 기준 등락률 표시',
    CLOSED: '전일 본장 종가 기준 · 다음 거래일 데이터로 갱신됨',
  };
  return`
  <div style="padding:7px 14px;background:${pm2.bg};border-bottom:1px solid ${pm2.border};display:flex;align-items:center;gap:8px">
    <span class="mono" style="font-size:10px;color:${pm2.color};font-weight:700">${pm2.label}</span>
    <span style="font-size:11px;color:${pm2.color}90">${msgs[S.marketPhase]||''}</span>
  </div>`;
}

function rMain(){
  if(S.view==='stocks')  return rStockView();
  if(S.view==='alerts')  return rAlertsView();
  if(S.view==='settings')return rSettingsView();
  return rSectorView();
}

function rSectorView(){
  if(S.loading&&!S.data)return rLoading();
  if(S.error&&!S.data)  return rError();
  if(!S.data)           return rLoading();

  const isIn=S.mainTab==='inflow';
  const sectors=S.data.filter(s=>s.flow===S.mainTab).sort((a,b)=>b.strength-a.strength);
  const inCnt=S.data.filter(s=>s.flow==='inflow').length;
  const outCnt=S.data.filter(s=>s.flow==='outflow').length;
  const upd=S.lastUpdate?S.lastUpdate.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';

  return`
  <div class="sup">
    ${rPhaseBanner()}
    ${S.error?`<div style="padding:6px 14px;background:#180A0A;border-bottom:1px solid #FF4D4F20"><p style="font-size:11px;color:#FF4D4F80">⚠ ${S.error} · 이전 데이터 표시 중</p></div>`:''}
    <div style="display:flex;border-bottom:2px solid #131E30;background:#080C18">
      <button class="tbtn" id="tab-in" style="flex:1;padding:13px 4px;font-size:14px;background:${isIn?'#06080F':'transparent'};color:${isIn?'#10D97E':'#4A5A70'};border-bottom:2px solid ${isIn?'#10D97E':'transparent'};margin-bottom:-2px">
        📈 자금 유입<span style="font-size:11px;display:block;font-weight:400;opacity:.7;margin-top:1px">${inCnt}개 섹터</span>
      </button>
      <div style="width:1px;background:#131E30;margin:8px 0"></div>
      <button class="tbtn" id="tab-out" style="flex:1;padding:13px 4px;font-size:14px;background:${!isIn?'#06080F':'transparent'};color:${!isIn?'#FF4D4F':'#4A5A70'};border-bottom:2px solid ${!isIn?'#FF4D4F':'transparent'};margin-bottom:-2px">
        📉 자금 유출<span style="font-size:11px;display:block;font-weight:400;opacity:.7;margin-top:1px">${outCnt}개 섹터</span>
      </button>
    </div>
    <div>${sectors.map((s,i)=>rSectorRow(s,i)).join('')}</div>
    <div style="padding:9px 14px;border-top:1px solid #0E1825;background:#080C18;padding-bottom:max(9px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center">
      <p style="font-size:12px;color:#3B5070;line-height:1.6;flex:1"><span style="color:#3B82F6">시장 ›</span> ${S.summary||''}</p>
      ${upd?`<span class="mono" style="font-size:9px;color:#2A3A55;flex-shrink:0;margin-left:8px">${upd}</span>`:''}
    </div>
  </div>`;
}

function rSectorRow(s,rank){
  const c=s.flow==='inflow'?'#10D97E':'#FF4D4F';
  const barW=Math.round(s.strength/5*100);
  const pm2=phaseMeta(s.etfPhase);
  const isPre=s.etfPhase==='PRE',isPost=s.etfPhase==='POST';
  const top=(s.stocks||[]).slice(0,3).map(st=>`<span class="mono" style="font-size:9px;color:${c}90;background:${c}0E;border-radius:3px;padding:2px 5px">${st.ticker}</span>`).join('');
  const more=Math.max(0,(s.stocks||[]).length-3);
  return`
  <div class="row sec-row" data-name="${s.name}" style="padding:14px;border-bottom:1px solid #0C1520;background:#06080F">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div style="width:26px;height:26px;border-radius:8px;background:${c}16;border:1px solid ${c}28;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span class="mono" style="font-size:11px;color:${c};font-weight:700">${rank+1}</span>
      </div>
      <span style="font-size:18px;flex-shrink:0">${s.icon}</span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px;min-width:0">
          <span style="font-size:15px;font-weight:600;color:#E2E8F0;white-space:nowrap">${s.name}</span>
          ${isPre?`<span class="mono" style="font-size:9px;color:${pm2.color};background:${pm2.bg};border:1px solid ${pm2.border};border-radius:4px;padding:1px 5px;flex-shrink:0">프리장</span>`:''}
          ${isPost?`<span class="mono" style="font-size:9px;color:${pm2.color};background:${pm2.bg};border:1px solid ${pm2.border};border-radius:4px;padding:1px 5px;flex-shrink:0">시간외</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
          <span class="mono" style="font-size:16px;color:${c};font-weight:700">${s.chgStr}</span>
          <span style="color:#2A3A55;font-size:18px">›</span>
        </div>
      </div>
    </div>
    <div style="margin-left:36px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
        <div style="flex:1;height:3px;background:#0E1825;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${barW}%;background:${c};border-radius:2px"></div>
        </div>
        <div style="display:flex;gap:3px">${Array.from({length:5},(_,i)=>`<div style="width:6px;height:6px;border-radius:50%;background:${i<s.strength?c:'#131E30'}"></div>`).join('')}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <p style="font-size:12px;color:#3B5070;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.reason}</p>
        <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
          ${top}${more>0?`<span style="font-size:9px;color:#2A3A55">+${more}</span>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function rStockView(){
  const sec=S.data?.find(s=>s.name===S.selSector);if(!sec)return'';
  const isIn=sec.flow==='inflow',c=isIn?'#10D97E':'#FF4D4F';
  const stocks=sec.stocks||[];
  const maxAbs=Math.max(...stocks.map(s=>Math.abs(s.chg)),0.1);
  const pm2=phaseMeta(sec.etfPhase);
  return`
  <div class="slide">

      <span class="mono" style="font-size:9px;color:#2A3A55">종목</span>
      <span class="mono" style="font-size:9px;color:#2A3A55;text-align:center">시장</span>

    </div>

    <div>
      ${stocks.map((st,i)=>{
        const isUp=st.chg>=0,sc=isUp?'#10D97E':'#FF4D4F';
        const bw=Math.round(Math.abs(st.chg)/maxAbs*100);
        const priceStr=st.price>0?(st.market==='KR'?st.price.toLocaleString('ko-KR')+'원':'$'+st.price.toFixed(2)):'';
        const stPm=phaseMeta(st.phase);
        const showPreBadge=st.phase==='PRE';
        const showPostBadge=st.phase==='POST'&&st.postChg!=null;
        return`
        <div class="row strow" style="display:grid;grid-template-columns:30px 1fr 36px 84px;padding:12px 14px;border-bottom:1px solid #0C1520;background:#06080F;gap:6px;align-items:center">
          <div style="width:24px;height:24px;border-radius:7px;background:${c}12;display:flex;align-items:center;justify-content:center">
            <span class="mono" style="font-size:10px;color:${c};font-weight:700">${i+1}</span>
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
              <span class="mono" style="font-size:14px;color:#E2E8F0;font-weight:700">${st.ticker}</span>
              ${i===0?`<span style="font-size:9px;background:${c}20;color:${c};border-radius:4px;padding:2px 5px;font-weight:600">HOT</span>`:''}
              ${showPreBadge?`<span class="mono" style="font-size:8px;color:${stPm.color};background:${stPm.bg};border-radius:3px;padding:1px 4px">프리</span>`:''}
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:10px;color:#2A3A55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px">${st.name}</span>
              <span class="mono" style="font-size:10px;color:#3B5070">${priceStr}</span>
            </div>
            ${showPostBadge?`<div style="margin-top:3px;font-size:10px;color:#818CF8">시간외 ${fmtChg(st.postChg)}</div>`:''}
            <div style="height:2px;background:#0E1825;border-radius:1px;overflow:hidden;max-width:130px;margin-top:5px">
              <div style="height:100%;width:${bw}%;background:${sc};border-radius:1px"></div>
            </div>
          </div>
          <div style="text-align:center;font-size:18px">${st.market==='KR'?'🇰🇷':'🇺🇸'}</div>
          <div style="text-align:right">
            <span class="mono stchg" data-base="${st.chg}" style="font-size:15px;color:${sc};font-weight:700">${fmtChg(st.chg)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div style="padding:14px;border-top:1px solid #131E30;background:#07090D;padding-bottom:max(14px,env(safe-area-inset-bottom))">
      <p class="mono" style="font-size:9px;color:#2A3A55;letter-spacing:1px;margin-bottom:10px">관련 ETF</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${[...sec.etfInfo.us.map(e=>({...e,kr:false})),...sec.etfInfo.kr.map(e=>({...e,kr:true}))].map(e=>`
        <div style="padding:7px 11px;background:#080C18;border:1px solid ${e.kr?'#1A3026':'#1A2A40'};border-radius:8px;display:flex;align-items:center;gap:6px">
          <span style="font-size:11px">${e.kr?'🇰🇷':'🇺🇸'}</span>
          <span class="mono" style="font-size:12px;color:${e.kr?'#34D399':'#60A5FA'};font-weight:700">${e.t}</span>
          <span style="font-size:11px;color:#3B5070">${e.n}</span>

}

  </div>`;
}

function attachEv(){
  $('refreshBtn')?.addEventListener('click',doFetch);
  $('retryBtn')?.addEventListener('click',doFetch);
  $('notifBtn')?.addEventListener('click',()=>{S.view='alerts';render();});
  $('settingsBtn')?.addEventListener('click',()=>{S.view='settings';render();});
  $('backBtn')?.addEventListener('click',()=>{S.view='sectors';S.selSector=null;render();});
  $('tab-in')?.addEventListener('click',()=>{S.mainTab='inflow';render();});
  $('tab-out')?.addEventListener('click',()=>{S.mainTab='outflow';render();});
  document.querySelectorAll('.sec-row').forEach(el=>el.addEventListener('click',()=>{S.selSector=el.dataset.name;S.view='stocks';render();}));
  document.querySelectorAll('.int-btn').forEach(b=>b.addEventListener('click',()=>{S.cfg.interval=parseInt(b.dataset.v);render();}));
  const nc=$('nchk');if(nc)nc.addEventListener('change',async e=>{S.cfg.notif=e.target.checked;if(e.target.checked)await askNotif();});
  $('saveCfg')?.addEventListener('click',()=>{saveSt();startTimers();const b=$('saveCfg');if(b){b.textContent='✓ 저장됨';b.style.color='#10D97E';setTimeout(()=>{if(b){b.textContent='✓ 저장 & 적용';b.style.color='#60A5FA';}},1500);}});
}

// ── 시작 ────────────────────────────────────────────────────────────────────
function init(){loadSt();render();doFetch();startTimers();askNotif();}
init();
</script>
</body>
</html>
