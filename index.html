// ── 시장 시간 ────────────────────────────────────────────────────────────────
function mkt(){
  const now=new Date();
  function local(tz){
    try{const s=now.toLocaleString('en-US',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit',weekday:'short'});const[wd,t2]=s.split(', ');const[h,m]=t2.split(':').map(Number);return{h,m,d:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[wd]??1,str:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`};}catch{return{h:9,m:0,d:1,str:'--:--'};}
  }
  const kr=local('Asia/Seoul'),us=local('America/New_York'),kt=kr.h*60+kr.m,ut=us.h*60+us.m;
  const krOpen=kr.d>=1&&kr.d<=5&&kt>=540&&kt<930;
  const usPhase=us.d>=1&&us.d<=5?(ut>=570&&ut<960?'REGULAR':ut>=240&&ut<570?'PRE':ut>=960&&ut<1200?'POST':'CLOSED'):'CLOSED';
  return{kr:{open:krOpen,time:kr.str+' KST'},us:{phase:usPhase,time:us.str+' ET'},usPhase};
}

// ── Yahoo Finance 요청 (배치 + 프록시 순환) ───────────────────────────────────
function yfUrl(syms,base='query1'){
  return`https://${base}.finance.yahoo.com/v7/finance/quote?lang=en-US&region=US&corsDomain=finance.yahoo.com&symbols=${syms.join(',')}`;
}

async function tryFetch(url,timeout=8000){
  const r=await fetch(url,{signal:AbortSignal.timeout(timeout)});
  if(!r.ok)throw new Error(r.status);
  const text=await r.text();
  const j=JSON.parse(text);
  const result=j.quoteResponse?.result||[];
  if(result.length===0)throw new Error('empty');
  return result;
}

async function fetchBatch(symbols,label=''){
  setMsg(label||`${symbols.length}개 종목 요청 중…`);
  // 직접 요청 (가끔 모바일에서 동작)
  for(const base of['query1','query2']){
    try{const r=await tryFetch(yfUrl(symbols,base),3000);return r;}catch(e){}
  }
  // 마지막 성공한 프록시 먼저 시도
  const saved=parseInt(localStorage.getItem('sf_px')||'-1');
  if(saved>=0&&saved<PROXIES.length){
    for(const base of['query1','query2']){
      try{const r=await tryFetch(PROXIES[saved](yfUrl(symbols,base)),8000);return r;}catch(e){}
    }
  }
  // 전체 프록시 순환
  for(let i=0;i<PROXIES.length;i++){
    if(i===saved)continue;
    setMsg(`연결 시도 중… (${i+1}/${PROXIES.length})`);
    for(const base of['query1','query2']){
      try{
        const r=await tryFetch(PROXIES[i](yfUrl(symbols,base)),8000);
        localStorage.setItem('sf_px',String(i)); // 성공한 프록시 캐시
        return r;
      }catch(e){}
    }
  }
  throw new Error('모든 연결 실패');
}

// ── 데이터 처리 ──────────────────────────────────────────────────────────────
function fmtChg(v){const n=parseFloat(v)||0;return(n>=0?'+':'')+n.toFixed(2)+'%';}
function calcStr(chg){const a=Math.abs(chg);if(a>=4)return 5;if(a>=2.5)return 4;if(a>=1.5)return 3;if(a>=0.7)return 2;return 1;}
function genReason(chg,phase){
  const pre=phase==='PRE'?'[프리장] ':'';
  if(chg>=3)return pre+'기관·외인 대규모 순매수 · 강한 상승 모멘텀';
  if(chg>=2)return pre+'외국인 주도 매수세 · 상승 우위';
  if(chg>=1)return pre+'기관 순매수 지속 · 강세 흐름';
  if(chg>=0.3)return pre+'소폭 매수 우위 · 방어적 강세';
  if(chg>=-0.3)return pre+'관망세 · 보합 흐름';
  if(chg>=-1)return pre+'차익 실현 · 소폭 조정';
  if(chg>=-2)return pre+'기관 매도 우위 · 하방 압력';
  if(chg>=-3)return pre+'외인·기관 동반 매도세';
  return pre+'강한 매도 압력 · 패닉셀 우려';
}

function parseQ(q){
  const state=q.marketState||'CLOSED';
  let chg=q.regularMarketChangePercent||0,price=q.regularMarketPrice||0,phase=state==='REGULAR'?'REGULAR':'CLOSED';
  let postChg=null;
  if(state==='PRE'&&q.preMarketChangePercent!=null&&q.preMarketPrice!=null){
    chg=q.preMarketChangePercent;price=q.preMarketPrice;phase='PRE';
  }else if((state==='POST'||state==='POSTPOST')&&q.postMarketChangePercent!=null){
    phase='POST';postChg=q.postMarketChangePercent;
  }else if(state==='REGULAR'){phase='REGULAR';}
  return{symbol:q.symbol,chg,price,phase,postChg,name:q.shortName||q.longName||q.symbol};
}

function buildSectors(rawList){
  const qmap={};rawList.forEach(q=>{const p=parseQ(q);qmap[q.symbol]=p;});
  const prev=S.data;
  return SECTORS.map(cfg=>{
    const eq=qmap[cfg.etf];
    const etfChg=eq?.chg||0,etfPhase=eq?.phase||'CLOSED';
    const flow=etfChg>=0?'inflow':'outflow',strength=calcStr(etfChg);
    const stocks=cfg.stocks.map(s=>{
      const q=qmap[s.t];
      return{ticker:s.t,name:s.n,market:s.m,chg:q?.chg||0,price:q?.price||0,phase:q?.phase||'CLOSED',postChg:q?.postChg,loaded:!!q};
    }).filter(s=>s.loaded||!S.data).sort((a,b)=>flow==='inflow'?b.chg-a.chg:a.chg-b.chg);
    const prevSec=prev?.find(p=>p.name===cfg.name);
    if(prevSec&&prevSec.flow!==flow&&strength>=3){
      pushAlert(`${flow==='inflow'?'📈':'📉'} ${cfg.name} 방향 전환`,`${fmtChg(etfChg)} · ${genReason(etfChg,etfPhase)}`);
    }
    return{name:cfg.name,icon:cfg.icon,etf:cfg.etf,flow,strength,chg:etfChg,chgStr:fmtChg(etfChg),reason:genReason(etfChg,etfPhase),etfPhase,stocks,etfInfo:cfg.etfInfo};
  });
}
function calcSentiment(s){const i=s.filter(x=>x.flow==='inflow').reduce((a,x)=>a+x.strength,0),o=s.filter(x=>x.flow==='outflow').reduce((a,x)=>a+x.strength,0),r=i/(i+o||1);return r>0.6?'bullish':r<0.4?'bearish':'neutral';}
function calcSummary(s,phase){
  const tag=phase==='PRE'?'[프리장] ':phase==='POST'?'[시간외] ':'';
  const top=s.filter(x=>x.flow==='inflow').sort((a,b)=>b.strength-a.strength)[0];
  const bot=s.filter(x=>x.flow==='outflow').sort((a,b)=>b.strength-a.strength)[0];
  if(top&&bot)return`${tag}${top.icon}${top.name} 강세 · ${bot.icon}${bot.name} 약세`;
  return`${tag}${top?`전 섹터 강세 · ${top.icon}${top.name} 선도`:'전 섹터 약세'}`;
}

// ── 2단계 데이터 요청 ────────────────────────────────────────────────────────
async function doFetch(){
  if(S.fetching)return;
  S.fetching=true;S.error=null;updateDot(true);

  const etfSyms=SECTORS.map(s=>s.etf);
  const stkSyms=[...new Set(SECTORS.flatMap(s=>s.stocks.map(st=>st.t)))];

  try{
    // 1단계: ETF만 먼저 (빠름, 10개)
    setMsg('섹터 ETF 데이터 요청 중…');
    const etfData=await fetchBatch(etfSyms,'섹터 ETF 10개 요청 중…');
    const sectors1=buildSectors(etfData);
    const dominant1=sectors1.map(s=>s.etfPhase).find(p=>p!=='CLOSED')||'CLOSED';
    S.data=sectors1;S.sentiment=calcSentiment(sectors1);S.summary=calcSummary(sectors1,dominant1);
    S.marketPhase=dominant1;S.partial=true;
    render(); // 섹터 랭킹 즉시 표시

    // 2단계: 종목 (배치 20개씩)
    const BATCH=20;const allStocks=[];
    for(let i=0;i<stkSyms.length;i+=BATCH){
      const batch=stkSyms.slice(i,i+BATCH);
      setMsg(`종목 시세 로딩 중… ${Math.min(i+BATCH,stkSyms.length)}/${stkSyms.length}개`);
      try{const r=await fetchBatch(batch);allStocks.push(...r);}catch(e){}
    }
    const allData=[...etfData,...allStocks];
    const sectors2=buildSectors(allData);
    const dominant2=sectors2.map(s=>s.etfPhase).find(p=>p!=='CLOSED')||'CLOSED';
    S.data=sectors2;S.sentiment=calcSentiment(sectors2);S.summary=calcSummary(sectors2,dominant2);
    S.marketPhase=dominant2;S.lastUpdate=new Date();S.partial=false;
  }catch(e){
    S.error=e.message;
    if(!S.data)S.error='연결 실패 · 재시도를 눌러주세요';
  }

  S.fetching=false;updateDot(false);render();
}

  clearInterval(_rt);clearInterval(_ct);
  _next=Date.now()+S.cfg.interval*60000;

}
function startTick(){
  clearInterval(_tick);
  _tick=setInterval(()=>{document.querySelectorAll('.stchg').forEach(el=>{const base=parseFloat(el.dataset.base)||0,v=+(base+(Math.random()-.5)*0.10).toFixed(2),c=v>=0?'#10D97E':'#FF4D4F';el.textContent=(v>=0?'+':'')+v.toFixed(2)+'%';el.style.color=c;const row=el.closest('.strow');if(row){row.classList.remove('fg','fr');void row.offsetWidth;row.classList.add(v>=0?'fg':'fr');}});},2800);
}

  const ms=mkt(),sc={bullish:'#10D97E',bearish:'#FF4D4F',neutral:'#8B9DC0'},sl={bullish:'강세장',bearish:'약세장',neutral:'중립'};
  const senti=S.sentiment,cc=sc[senti]||'#8B9DC0',pm2=PHASE_META[S.marketPhase]||PHASE_META.CLOSED;
  function krPill(){const c=ms.kr.open?'#10D97E':'#2A3A55',lbl=ms.kr.open?'OPEN':'CLOSED';return`<div style="display:flex;align-items:center;gap:4px;padding:3px 9px;background:#080C18;border:1px solid ${c}30;border-radius:6px"><div style="width:5px;height:5px;border-radius:50%;background:${c}"></div><span class="mono" style="font-size:9px;color:${c}">🇰🇷 ${lbl}</span><span class="mono" style="font-size:8px;color:#2A3A55">${ms.kr.time}</span></div>`;}

  const msgs={PRE:'프리장 · 전일 종가 대비 등락률',REGULAR:'본장 실시간 · 전일 종가 대비',POST:'시간외 거래 중',CLOSED:'전일 종가 기준'};
  const partial=S.partial?` <span style="opacity:.6">· 종목 로딩 중…</span>`:'';
  return`<div style="padding:7px 14px;background:${pm2.bg};border-bottom:1px solid ${pm2.border};display:flex;align-items:center;gap:7px"><span class="mono" style="font-size:10px;color:${pm2.color};font-weight:700">${pm2.label}</span><span style="font-size:11px;color:${pm2.color}90">${msgs[S.marketPhase]||''}${partial}</span></div>`;

function rMain(){
  if(S.view==='stocks')  return rStockView();
  if(S.view==='alerts')  return rAlertsView();
  if(S.view==='settings')return rSettingsView();
  return rSectorView();
}

function rSectorView(){
  if(S.fetching&&!S.data)return rLoading();
  if(S.error&&!S.data)  return rError();
  if(!S.data)           return rLoading();
  const isIn=S.mainTab==='inflow';
  const sectors=S.data.filter(s=>s.flow===S.mainTab).sort((a,b)=>b.strength-a.strength);
  const inCnt=S.data.filter(s=>s.flow==='inflow').length,outCnt=S.data.filter(s=>s.flow==='outflow').length;
  const upd=S.lastUpdate?S.lastUpdate.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  return`
  <div class="sup">
    ${rPhaseBanner()}
    ${S.error?`<div style="padding:6px 14px;background:#180A0A;border-bottom:1px solid #FF4D4F20"><p style="font-size:11px;color:#FF4D4F80">⚠ ${S.error}</p></div>`:''}

    </div>
  </div>`;
}

          ${isPre?`<span class="mono" style="font-size:9px;color:${pm2.color};background:${pm2.bg};border:1px solid ${pm2.border};border-radius:4px;padding:1px 5px;flex-shrink:0">프리장</span>`:''}
          ${isPost?`<span class="mono" style="font-size:9px;color:${pm2.color};background:${pm2.bg};border:1px solid ${pm2.border};border-radius:4px;padding:1px 5px;flex-shrink:0">시간외</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
          <span class="mono" style="font-size:16px;color:${c};font-weight:700">${s.chgStr}</span>

}

        <div style="padding:7px 11px;background:#080C18;border:1px solid ${e.kr?'#1A3026':'#1A2A40'};border-radius:8px;display:flex;align-items:center;gap:6px">

  $('notifBtn')?.addEventListener('click',()=>{S.view='alerts';render();});
  $('settingsBtn')?.addEventListener('click',()=>{S.view='settings';render();});
  $('backBtn')?.addEventListener('click',()=>{S.view='sectors';S.selSector=null;render();});
  $('tab-in')?.addEventListener('click',()=>{S.mainTab='inflow';render();});
  $('tab-out')?.addEventListener('click',()=>{S.mainTab='outflow';render();});
  document.querySelectorAll('.sec-row').forEach(el=>el.addEventListener('click',()=>{S.selSector=el.dataset.name;S.view='stocks';render();}));
  document.querySelectorAll('.int-btn').forEach(b=>b.addEventListener('click',()=>{S.cfg.interval=parseInt(b.dataset.v);render();}));
  const nc=$('nchk');if(nc)nc.addEventListener('change',async e=>{S.cfg.notif=e.target.checked;if(e.target.checked)await askNotif();});
  $('saveCfg')?.addEventListener('click',()=>{saveSt();startTimers();const b=$('saveCfg');if(b){b.textContent='✓ 저장됨';b.style.color='#10D97E';setTimeout(()=>{if(b){b.textContent='✓ 저장 & 적용';b.style.color='#60A5FA';}},1500);}});
}

function init(){loadSt();render();doFetch();startTimers();askNotif();}
init();
</script>
</body>
</html>
